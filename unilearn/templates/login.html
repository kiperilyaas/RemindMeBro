{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="center">
  <form class="box" method="post" action="/login">
    <div><div class="eyebrow">{{ site_name }}</div><h1 style="margin-top:4px">Log in to UniLearn</h1></div>
    <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="next" value="{{ next }}">
    <label class="field">Username<input name="username" autocomplete="username" required autofocus></label>
    <label class="field">Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary big">Log in</button>
    <div class="fine">Students sign in with the email and password they chose in Remind Me Bro. Staff passwords are in <span class="mono">data/STAFF-PASSWORDS.txt</span> on the computer that runs the demo.</div>
  </form>
</div>
{% endblock %}
